[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-log-triage"
version = "0.3.0"
description = "Triage Linux auth and Windows Security logs into MITRE ATT&CK-mapped alerts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
soc-triage = "soc_triage.cli:main"

[tool.setuptools]
packages = ["soc_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
