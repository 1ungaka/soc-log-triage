---
title: Directory Or File Brute Forcing From Single Source
id: 927425a7-3b38-499a-9c07-77b2130715c6
status: experimental
description: At least 20 HTTP 404 responses to one client IP in 5 minutes. soc-log-triage rule WEB-001.
references:
    - https://attack.mitre.org/techniques/T1595/003/
author: 1ungaka
date: 2026-11-10
tags:
    - attack.reconnaissance
    - attack.t1595.003
correlation:
    type: event_count
    rules:
        - web_not_found
    group-by:
        - c-ip
    timespan: 5m
    condition:
        gte: 20
falsepositives:
    - Search engine crawlers following stale links; allow-list verified crawler ranges
level: medium
