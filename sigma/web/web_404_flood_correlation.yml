title: Web Request Not Found
id: 241eff80-c5a7-4637-9455-674eb5b6e3c0
name: web_not_found
status: experimental
description: Base rule for the directory brute forcing correlation (HTTP 404 responses).
references:
    - https://attack.mitre.org/techniques/T1595/003/
author: 1ungaka
date: 2026-11-10
tags:
    - attack.reconnaissance
    - attack.t1595
logsource:
    category: webserver
detection:
    selection:
        sc-status: 404
    condition: selection
falsepositives:
    - Broken links and missing favicons
