title: Member Added To Privileged Group
id: c73b402c-09aa-4d44-b6d3-eeb5c4061724
status: experimental
description: |
    Detects an account being added to a privileged local, global or universal group.
    soc-log-triage rule ACCT-002 (ACCT-003 adds correlation with a recent 4720 for the same account).
references:
    - https://attack.mitre.org/techniques/T1098/
author: 1ungaka
date: 2026-11-10
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID:
            - 4728
            - 4732
            - 4756
        TargetUserName:
            - 'Administrators'
            - 'Domain Admins'
            - 'Enterprise Admins'
            - 'Schema Admins'
            - 'Account Operators'
            - 'Backup Operators'
            - 'Remote Desktop Users'
    condition: selection
falsepositives:
    - Approved administrative changes; match against change tickets
level: high
