name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -v
      - name: Scan the sample scenario
        run: python -m soc_triage scan sample_logs/* --year 2026

  sigma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sigma-cli
      - run: sigma plugin install splunk
      - name: Validate Sigma rules
        run: sigma check --fail-on-issues sigma/
      - name: Convert to Splunk
        run: sigma convert -t splunk --without-pipeline sigma/
