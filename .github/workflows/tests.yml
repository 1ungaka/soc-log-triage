name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -v
      - name: Scan the sample scenario
        run: python -m soc_triage scan sample_logs/auth.log sample_logs/windows_security.jsonl sample_logs/sysmon.jsonl --year 2026
